<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dawned OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Bar -->
    <header id="topbar">
        <div id="topbar-left">Dawned OS</div>
        <div id="topbar-center" id="clock"></div>
        <div id="topbar-right">Made by Aamir</div>
    </header>

    <!-- App Grid -->
    <div id="app-grid">

        <!-- Motivation Browser -->
        <div class="app" onclick="openApp('https://aamirkpathan.github.io/dawnedMotivation/')">
            <img src="icons/motivation.png" alt="Motivation">
            <span>Motivation</span>
        </div>

        <!-- Gitboard -->
        <div class="app" onclick="openApp('https://aamirkpathan.github.io/TheGitboard2.0/')">
            <img src="icons/gitboard.png" alt="Gitboard">
            <span>Gitboard</span>
        </div>

        <!-- Notes -->
        <div class="app" onclick="openApp('notes.html')">
            <img src="icons/notes.png" alt="Notes">
            <span>Notes</span>
        </div>

        <!-- Settings -->
        <div class="app" onclick="openApp('settings.html')">
            <img src="icons/settings.png" alt="Settings">
            <span>Settings</span>
        </div>

        <!-- Removed Spotify -->
        <!-- (No Spotify app tile here anymore) -->

    </div>

    <script src="main.js" defer></script>
</body>
</html>
